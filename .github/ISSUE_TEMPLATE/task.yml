name: タスク / Task
description: 改善、機能追加、コンテンツ、CMS、運用など / Improvements, features, content, CMS, or operations
title: "[タスク] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要 / Summary
      description: 何をしたいか、または何を変えたいかを1-3行で書いてください。 / Describe the requested change in 1–3 lines.
      placeholder: |
        例: トップページの導線文言をCMSから編集できるようにする。
        Example: Let editors update the homepage call to action in the CMS.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件 / Done when
      description: 完了と判断できる状態をチェックリストで書いてください。 / List the conditions that would make this task complete.
      placeholder: |
        - [ ] 対象文言がCMSから編集できる / Editors can change the text in the CMS
        - [ ] 既存表示が崩れない / Existing pages still display correctly
        - [ ] 必要な検証が通る / Required checks pass
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 関連情報 / Context
      description: URL、関連ファイル、期限、制約、背景があれば書いてください。 / Add URLs, related files, deadlines, constraints, or background.
      placeholder: |
        - URL:
        - 関連ファイル / Related files:
        - 補足 / Notes:
